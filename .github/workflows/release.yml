name: release

# A maintainer starts one release-candidate run from the exact release commit.
# It builds and uploads the native matrix first, then waits at the protected
# `release` environment. Only after exact-artifact/Word qualification is
# approved does the same run bind the tag, publish exact npm tarballs, and
# attach the verified GitHub assets.
# See RELEASING.md for the required environment protection and full checklist.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable MAJOR.MINOR.PATCH shared by the release manifests, without the v prefix"
        required: true
        type: string
      commit_sha:
        description: "Full 40-character release commit SHA expected at the selected ref"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

# Least privilege by default; each job that needs more declares it itself.
permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Manual values are data, never workflow-generated shell source. The first
  # job validates these before any job with write or publish authority runs.
  REQUESTED_VERSION: ${{ inputs.version }}
  REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}

jobs:
  version-guard:
    # A mixed workspace version could publish npm packages whose version
    # disagrees with the Rust crates or plugin manifests. Refuse, don't
    # reconcile.
    name: requested version matches release manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare requested version to Cargo.toml
        run: |
          requested="$REQUESTED_VERSION"
          requested_sha="$REQUESTED_COMMIT_SHA"
          if [[ ! "$requested" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Requested version must be stable MAJOR.MINOR.PATCH SemVer without prerelease or build metadata."
            exit 1
          fi
          if [[ ! "$requested_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Requested commit must be a full lowercase hexadecimal SHA."
            exit 1
          fi
          python3 - "$requested" <<'PY'
          import json
          from pathlib import Path
          import sys
          import tomllib

          requested = sys.argv[1]
          cargo_manifests = [
              Path("stemma-engine/Cargo.toml"),
              Path("stemma-diff/Cargo.toml"),
              Path("stemma-artifacts/Cargo.toml"),
              Path("stemma-cli/Cargo.toml"),
              Path("stemma-mcp/Cargo.toml"),
              Path("stemma-api/Cargo.toml"),
              Path("stemma-py/Cargo.toml"),
          ]
          json_manifests = [
              Path("stemma-mcp/mcpb/manifest.json"),
              Path("stemma-mcp/plugin/.claude-plugin/plugin.json"),
          ]

          mismatches = []
          for path in cargo_manifests:
              version = tomllib.loads(path.read_text(encoding="utf-8"))["package"]["version"]
              if version != requested:
                  mismatches.append(f"{path}: {version}")
          for path in json_manifests:
              version = json.loads(path.read_text(encoding="utf-8"))["version"]
              if version != requested:
                  mismatches.append(f"{path}: {version}")
          if mismatches:
              raise SystemExit(
                  "requested version " + requested + " does not match:\n  "
                  + "\n  ".join(mismatches)
              )

          dependency_checks = {
              Path("stemma-diff/Cargo.toml"): ["stemma"],
              Path("stemma-cli/Cargo.toml"): ["stemma", "stemma-diff", "stemma-artifacts"],
              Path("stemma-mcp/Cargo.toml"): ["stemma", "stemma-diff", "stemma-artifacts"],
              Path("stemma-py/Cargo.toml"): ["stemma", "stemma-diff", "stemma-artifacts"],
          }
          dependency_mismatches = []
          for path, names in dependency_checks.items():
              dependencies = tomllib.loads(path.read_text(encoding="utf-8"))["dependencies"]
              for name in names:
                  version = dependencies[name].get("version")
                  if version != requested:
                      dependency_mismatches.append(f"{path} dependency {name}: {version}")
          if dependency_mismatches:
              raise SystemExit(
                  "internal dependency versions do not match " + requested + ":\n  "
                  + "\n  ".join(dependency_mismatches)
              )

          # The PyPI version must come from stemma-py/Cargo.toml (checked
          # above), never from a second hand-maintained field.
          project = tomllib.loads(
              Path("stemma-py/pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          if "version" in project or project.get("dynamic") != ["version"]:
              raise SystemExit(
                  "stemma-py/pyproject.toml must declare dynamic = [\"version\"] "
                  "and no static version"
              )
          PY
          if [ "$requested_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Requested commit $requested_sha does not match selected ref commit $GITHUB_SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit $GITHUB_SHA is not reachable from origin/main."
            exit 1
          fi
          tag_sha="$(git ls-remote --tags origin "refs/tags/v$requested" | awk 'NR == 1 { print $1 }')"
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag v$requested already binds a different source: $tag_sha."
            exit 1
          fi
          if [ -n "$tag_sha" ]; then
            echo "Retrying the source already bound by tag v$requested."
          fi
          echo "Releasing Stemma $requested"
      - name: Verify release environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/environments/release" > "$RUNNER_TEMP/release-environment.json"
          python3 - "$RUNNER_TEMP/release-environment.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              environment = json.load(stream)
          rules = environment.get("protection_rules") or []
          reviewer_rules = [
              rule for rule in rules if rule.get("type") == "required_reviewers"
          ]
          if len(reviewer_rules) != 1:
              raise SystemExit(
                  "release environment must have exactly one required-reviewers rule"
              )
          rule = reviewer_rules[0]
          if not rule.get("reviewers"):
              raise SystemExit("release environment must name at least one reviewer")
          if rule.get("prevent_self_review"):
              print("release environment prevents self-review")
          else:
              print(
                  "release environment allows self-review "
                  "(solo-maintainer contract: the required-reviewer pause "
                  "still gates promotion)"
              )
          print("release environment protection is configured")
          PY
      - name: Verify release tag mutation protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/rulesets?targets=tag&includes_parents=true&per_page=100" \
            > "$RUNNER_TEMP/tag-rulesets.json"
          ruleset_id="$(python3 stemma-mcp/verify_release_tag_ruleset.py \
            select "$RUNNER_TEMP/tag-rulesets.json")"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/$ruleset_id?includes_parents=true" \
            > "$RUNNER_TEMP/release-tag-ruleset.json"
          python3 stemma-mcp/verify_release_tag_ruleset.py \
            verify "$RUNNER_TEMP/release-tag-ruleset.json" "$ruleset_id"

  build:
    name: build (${{ matrix.target }})
    needs: version-guard
    strategy:
      # A release is all five platforms or nothing — a partial matrix must not
      # publish, so let one failure cancel the rest.
      matrix:
        include:
          # ubuntu-22.04 pins the glibc floor (2.35) for the linux binaries.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, bin: stemma-mcp }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, bin: stemma-mcp }
          # Use native runners for both macOS architectures so the qualification
          # step executes each exact binary rather than merely cross-compiling.
          - { target: x86_64-apple-darwin, os: macos-15-intel, bin: stemma-mcp }
          - { target: aarch64-apple-darwin, os: macos-15, bin: stemma-mcp }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, bin: stemma-mcp.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build release binary
        shell: bash
        run: |
          version="$REQUESTED_VERSION"
          export STEMMA_MCP_BUILD_STAMP="${version}+g${GITHUB_SHA:0:12}"
          cargo build -p stemma-mcp --release --target "${{ matrix.target }}"
      - name: Qualify exact release binary over MCP
        shell: bash
        run: |
          python stemma-mcp/smoke_test.py \
            "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
            stemma-examples/samples/safe-agreement.docx
      - name: Enforce exact-binary artifact conformance
        shell: bash
        run: |
          mkdir -p "qualification/${{ matrix.target }}"
          python stemma-mcp/safe_artifact_conformance.py \
            "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
            | tee "qualification/${{ matrix.target }}/safe-artifact-conformance.json"
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.target }}/"
          cp "qualification/${{ matrix.target }}/safe-artifact-conformance.json" \
            "dist/${{ matrix.target }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  python-wheels:
    # The experimental stemma-py package (PyPI `stemma-py`, import `stemma`).
    # One abi3 wheel per platform serves every CPython >= 3.9. Each wheel is
    # installed into a fresh virtual environment on its own platform and runs
    # the Python suite before upload, so the approved bytes are the exercised
    # bytes. Artifact names carry no dash: the native jobs below select their
    # artifacts with the "*-*-*" pattern.
    name: python wheel (${{ matrix.label }})
    needs: version-guard
    strategy:
      matrix:
        include:
          # manylinux2014 (glibc 2.17) is the widest glibc floor maturin builds
          # for. The x86_64 leg runs the suite on the Python floor (3.9).
          - { label: manylinux_x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, manylinux: "2_17", platform: 'manylinux_2_17_x86_64(\.manylinux2014_x86_64)?', smoke: native, python: "3.9" }
          - { label: manylinux_aarch64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_17", platform: 'manylinux_2_17_aarch64(\.manylinux2014_aarch64)?', smoke: native, python: "3.12" }
          - { label: musllinux_x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, platform: 'musllinux_1_2_x86_64', smoke: alpine, python: "3.12" }
          - { label: macos_arm64, os: macos-15, target: aarch64-apple-darwin, manylinux: "off", platform: 'macosx_[0-9]+_[0-9]+_arm64', smoke: native, python: "3.12" }
          - { label: macos_x86_64, os: macos-15-intel, target: x86_64-apple-darwin, manylinux: "off", platform: 'macosx_[0-9]+_[0-9]+_x86_64', smoke: native, python: "3.12" }
          - { label: windows_x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, manylinux: "off", platform: 'win_amd64', smoke: native, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --manifest-path stemma-py/Cargo.toml
      - name: Require exactly one wheel for this platform at the requested version
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          expected = re.compile(
              r"stemma_py-{}-cp39-abi3-(?:{})\.whl".format(
                  re.escape(os.environ["REQUESTED_VERSION"]), os.environ["EXPECTED_PLATFORM"]
              )
          )
          found = sorted(path.name for path in Path("dist").iterdir())
          if len(found) != 1 or not expected.fullmatch(found[0]):
              raise SystemExit(
                  "expected one wheel matching {}, built: {}".format(
                      expected.pattern, ", ".join(found) or "nothing"
                  )
              )
          print("built " + found[0])
          PY
      - name: Install into a fresh venv and run the Python suite
        if: matrix.smoke == 'native'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }}"
          "$py" -m pip install --quiet dist/*.whl pytest
          "$py" -m pytest -p no:cacheprovider stemma-py/tests
      - name: Install into a fresh Alpine venv and run the Python suite
        if: matrix.smoke == 'alpine'
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src python:3.12-alpine sh -euc '
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install --quiet dist/*.whl pytest
            /tmp/venv/bin/python -m pytest -p no:cacheprovider stemma-py/tests
          '
      - uses: actions/upload-artifact@v4
        with:
          name: python_wheel_${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  python-sdist:
    # The source distribution is what pip builds on a platform without a
    # wheel. Building it from the extracted archive, outside the workspace,
    # proves it is complete (as package-check does for the crates).
    name: python sdist
    needs: version-guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist --manifest-path stemma-py/Cargo.toml
      - name: Require exactly the expected sdist at the requested version
        run: |
          expected="stemma_py-${REQUESTED_VERSION}.tar.gz"
          found="$(ls dist)"
          if [ "$found" != "$expected" ]; then
            echo "::error::Expected exactly $expected, built: $found"
            exit 1
          fi
      - name: Build and install from the sdist alone, then run the Python suite
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          cp dist/*.tar.gz "$RUNNER_TEMP/"
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv/bin/pip" install --quiet ./stemma_py-*.tar.gz pytest)
          "$RUNNER_TEMP/venv/bin/python" -m pytest -p no:cacheprovider stemma-py/tests
      - uses: actions/upload-artifact@v4
        with:
          name: python_sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  python-candidate:
    # Freeze the exact Python distribution set the approver qualifies: all six
    # wheels plus the sdist, nothing else, with their SHA-256 sums.
    name: freeze exact python distribution set
    needs: [python-wheels, python-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python_*
          path: python-candidate/dist
          merge-multiple: true
      - name: Verify the set and record checksums
        run: |
          python3 - python-candidate/dist <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          version = re.escape(os.environ["REQUESTED_VERSION"])
          # One file per pattern: the sdist and each python-wheels matrix leg.
          patterns = [r"stemma_py-{}\.tar\.gz".format(version)] + [
              r"stemma_py-{}-cp39-abi3-(?:{})\.whl".format(version, platform)
              for platform in (
                  r"manylinux_2_17_x86_64(\.manylinux2014_x86_64)?",
                  r"manylinux_2_17_aarch64(\.manylinux2014_aarch64)?",
                  r"musllinux_1_2_x86_64",
                  r"macosx_[0-9]+_[0-9]+_arm64",
                  r"macosx_[0-9]+_[0-9]+_x86_64",
                  r"win_amd64",
              )
          ]
          found = sorted(path.name for path in Path(sys.argv[1]).iterdir())
          problems = []
          for pattern in patterns:
              matches = [name for name in found if re.fullmatch(pattern, name)]
              if len(matches) != 1:
                  problems.append("{} matched {}".format(pattern, matches or "nothing"))
          unexpected = [
              name for name in found if not any(re.fullmatch(p, name) for p in patterns)
          ]
          if unexpected:
              problems.append("unexpected files: " + ", ".join(unexpected))
          if problems:
              raise SystemExit("python distribution set is not exact:\n  " + "\n  ".join(problems))
          print("python distribution set is exact: " + ", ".join(found))
          PY
          cd python-candidate
          sha256sum dist/* > sha256sums.txt
          cat sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: python_dist
          path: python-candidate
          if-no-files-found: error

  candidate-manifest:
    name: freeze exact five-target candidate manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # Only the native target artifacts (Rust target triples, at least
          # two dashes): the python_* artifacts of this run must not enter the
          # exact five-target layout the manifest builder requires.
          pattern: "*-*-*"
          path: candidate-inputs
      - name: Validate matrix and write create-new manifest
        run: |
          python3 stemma-mcp/build_candidate_manifest.py \
            candidate-inputs \
            "$REQUESTED_VERSION" \
            "$GITHUB_SHA" \
            candidate-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-manifest
          path: candidate-manifest.json
          if-no-files-found: error

  release-approval:
    # Configure this environment with required reviewers and prevent
    # self-review. Reviewers approve only after downloading this run's build
    # artifacts and recording the exact-artifact Word qualification result.
    name: approve exact candidate after Word qualification
    needs: [candidate-manifest, python-candidate]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Record promotion boundary
        run: |
          echo "Approved exact candidate from commit $GITHUB_SHA"
          echo "Pinned request commit: $REQUESTED_COMMIT_SHA"
          echo "Requested release version: $REQUESTED_VERSION"
          echo "Approved candidate identity: candidate-manifest workflow artifact"

  release-package:
    # Every fallible preparation step runs BEFORE anything irreversible. If
    # packaging fails, the run stops here with no tag bound and no package
    # published, so the same version can be fixed and re-dispatched cleanly.
    # 0.2.0 lost its release assets precisely because this work ran after npm
    # had already published: a trivial shell error became unrecoverable.
    name: package approved assets before publication
    needs: release-approval
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # Native target artifacts are named for Rust target triples (at
          # least two dashes); fetching by pattern plus explicit names keeps
          # later-run artifacts such as `release-assets` out of the verifier's
          # exact-layout root, including on a re-run of failed jobs.
          pattern: "*-*-*"
          path: binaries
      - uses: actions/download-artifact@v4
        with:
          name: candidate-manifest
          path: binaries/candidate-manifest
      - name: Re-verify downloaded candidate against the approved manifest
        run: |
          python3 stemma-mcp/verify_candidate_manifest.py \
            binaries "$REQUESTED_VERSION" "$GITHUB_SHA"
      - name: Package archives, conformance reports, and checksums
        run: |
          bash stemma-mcp/package_release_assets.sh \
            binaries "$REQUESTED_VERSION" release
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release
          if-no-files-found: error

  release-claim:
    # Claim the approved version before npm's irreversible publication. This
    # prevents an ordinary concurrent writer from binding the name elsewhere;
    # the native package stamp and npm provenance remain the source identity.
    name: bind approved source to release tag
    needs: release-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Re-verify protection and create or confirm the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$REQUESTED_VERSION"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets?targets=tag&includes_parents=true&per_page=100" \
            > "$RUNNER_TEMP/tag-rulesets.json"
          ruleset_id="$(python3 stemma-mcp/verify_release_tag_ruleset.py \
            select "$RUNNER_TEMP/tag-rulesets.json")"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/$ruleset_id?includes_parents=true" \
            > "$RUNNER_TEMP/release-tag-ruleset.json"
          python3 stemma-mcp/verify_release_tag_ruleset.py \
            verify "$RUNNER_TEMP/release-tag-ruleset.json" "$ruleset_id"

          tag_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')"
          if [ -z "$tag_sha" ]; then
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="$GITHUB_SHA"; then
              echo "Tag creation raced another writer; checking the resulting binding."
            fi
            tag_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')"
          fi
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag does not identify approved source $GITHUB_SHA."
            exit 1
          fi

  npm-publish:
    # Deliberately minimal: downloads prebuilt artifacts and publishes — no
    # dependency installs, no test runs. This job holds publish rights; code
    # execution belongs in ci.yml and the build job.
    name: publish npm packages
    needs: release-claim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write # OIDC trusted publishing + provenance attestations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # Native target artifacts are named for Rust target triples (at
          # least two dashes); fetching by pattern plus explicit names keeps
          # later-run artifacts such as `release-assets` out of the verifier's
          # exact-layout root, including on a re-run of failed jobs.
          pattern: "*-*-*"
          path: binaries
      - uses: actions/download-artifact@v4
        with:
          name: candidate-manifest
          path: binaries/candidate-manifest
      - name: Re-verify downloaded candidate against the approved manifest
        run: |
          python3 stemma-mcp/verify_candidate_manifest.py \
            binaries "$REQUESTED_VERSION" "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and verify the npm OIDC runtime
        # Auth is npm's OIDC trusted-publisher exchange (configured on each
        # package on npmjs.com) — no registry token exists anywhere. OIDC
        # requires Node >= 22.14.0 and npm >= 11.5.1.
        run: |
          npm install -g npm@11.5.1
          python3 - "$(node --version)" "$(npm --version)" <<'PY'
          import re
          import sys

          def parse_version(value, label):
              pattern = r"v?([0-9]+)\.([0-9]+)\.([0-9]+)(?:[-+].*)?"
              match = re.fullmatch(pattern, value)
              if match is None:
                  raise SystemExit(
                      "{} returned an invalid version: {!r}".format(label, value)
                  )
              return tuple(int(component) for component in match.groups())

          node = parse_version(sys.argv[1], "node")
          npm = parse_version(sys.argv[2], "npm")
          if node < (22, 14, 0):
              raise SystemExit("npm trusted publishing requires Node >= 22.14.0")
          if npm < (11, 5, 1):
              raise SystemExit("npm trusted publishing requires npm >= 11.5.1")
          print(
              "verified npm OIDC runtime: Node {} / npm {}".format(
                  sys.argv[1], sys.argv[2]
              )
          )
          PY
      - name: Assemble packages (strict — all five platforms)
        run: bash stemma-mcp/npm/build-npm-packages.sh binaries out
      - name: Re-verify public ref state and protection before irreversible publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$REQUESTED_VERSION"
          tag_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag no longer identifies approved source $GITHUB_SHA."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/rulesets?targets=tag&includes_parents=true&per_page=100" \
            > "$RUNNER_TEMP/tag-rulesets.json"
          ruleset_id="$(python3 stemma-mcp/verify_release_tag_ruleset.py \
            select "$RUNNER_TEMP/tag-rulesets.json")"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/$ruleset_id?includes_parents=true" \
            > "$RUNNER_TEMP/release-tag-ruleset.json"
          python3 stemma-mcp/verify_release_tag_ruleset.py \
            verify "$RUNNER_TEMP/release-tag-ruleset.json" "$ruleset_id"
      - name: Publish platform packages, then the wrapper
        # The wrapper goes last: from the moment @stemma-sh/mcp resolves at a
        # version, every binary it pins must already exist.
        run: bash stemma-mcp/npm/publish-npm-packages.sh out

  pypi-publish:
    # Deliberately minimal, like npm-publish: downloads the frozen python_dist
    # set and publishes it; no builds, no test runs. Authentication is PyPI
    # trusted publishing (OIDC): no PyPI token exists anywhere.
    name: publish stemma-py to PyPI
    needs: [npm-publish, python-candidate]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write # PyPI trusted publishing + attestations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python_dist
          path: python-dist
      - name: Re-verify the approved distribution set
        run: |
          set -euo pipefail
          cd python-dist
          sha256sum -c sha256sums.txt
          listed="$(awk '{print $2}' sha256sums.txt | sort)"
          present="$(find dist -type f | sort)"
          if [ "$listed" != "$present" ]; then
            echo "::error::python_dist holds files outside the approved checksum list."
            exit 1
          fi
      - name: Re-verify the release tag before irreversible publication
        run: |
          set -euo pipefail
          tag="v$REQUESTED_VERSION"
          tag_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag no longer identifies approved source $GITHUB_SHA."
            exit 1
          fi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/dist
          # A retried job finds its own earlier uploads; the next step refuses
          # any file whose bytes on PyPI differ from the approved ones.
          skip-existing: true
      - name: Verify PyPI serves exactly the approved files
        run: |
          python3 - python-dist/sha256sums.txt <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = os.environ["REQUESTED_VERSION"]
          approved = {}
          for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              digest, path = line.split(maxsplit=1)
              approved[Path(path).name] = digest
          url = "https://pypi.org/pypi/stemma-py/{}/json".format(version)
          for attempt in range(1, 31):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      release = json.load(response)
                  served = {item["filename"]: item["digests"]["sha256"] for item in release["urls"]}
                  if served == approved:
                      print("PyPI serves exactly the approved {} files".format(len(served)))
                      break
                  if set(served) - set(approved) or any(
                      served[name] != approved[name] for name in set(served) & set(approved)
                  ):
                      raise SystemExit(
                          "PyPI stemma-py {} differs from the approved files: {}".format(version, served)
                      )
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              print("waiting for PyPI to serve stemma-py {} ({}/30)".format(version, attempt))
              time.sleep(10)
          else:
              raise SystemExit("PyPI did not serve the approved stemma-py {} files within 5 minutes".format(version))
          PY

  github-release:
    name: attach binaries to the GitHub release
    needs: [npm-publish, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write # create the release + upload assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # Every native target artifact is named for a Rust target triple and
          # therefore carries at least two dashes; `candidate-manifest` and
          # `release-assets` carry one and are fetched by name below. Keeping
          # them apart preserves the verifier's exact-layout requirement.
          pattern: "*-*-*"
          path: binaries
      - uses: actions/download-artifact@v4
        with:
          name: candidate-manifest
          path: binaries/candidate-manifest
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Re-verify downloaded candidate against the approved manifest
        run: |
          python3 stemma-mcp/verify_candidate_manifest.py \
            binaries "$REQUESTED_VERSION" "$GITHUB_SHA"
      - name: Verify the approved assets against their recorded checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum -c sha256sums.txt
      - name: Create or complete the exact draft, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$REQUESTED_VERSION"
          tag_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag no longer identifies approved source $GITHUB_SHA."
            exit 1
          fi

          release_json="$RUNNER_TEMP/release.json"
          notes_path="$RUNNER_TEMP/release-notes.md"
          python3 stemma-mcp/render_release_notes.py \
            "$REQUESTED_VERSION" > "$notes_path"
          notes="$(cat "$notes_path")"
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" > "$release_json" 2>/dev/null; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$tag" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$tag" \
              -f body="$notes" \
              -F draft=true > "$release_json"
          fi

          release_metadata="$(python3 - "$release_json" "$tag" "$notes_path" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              release = json.load(stream)
          with open(sys.argv[3], encoding="utf-8") as stream:
              expected_body = stream.read()
          if release.get("tag_name") != sys.argv[2]:
              raise SystemExit("release tag does not match the approved tag")
          if (release.get("body") or "").rstrip("\n") != expected_body.rstrip("\n"):
              raise SystemExit("release body does not match the source-controlled release notes")
          release_id = release.get("id")
          if type(release_id) is not int:
              raise SystemExit("release response has no numeric id")
          draft = release.get("draft")
          if type(draft) is not bool:
              raise SystemExit("release response has no boolean draft state")
          if release.get("prerelease") is not False:
              raise SystemExit("release must not be marked as a prerelease")
          print(f"{release_id}\t{str(draft).lower()}")
          PY
          )"
          IFS=$'\t' read -r release_id release_is_draft <<< "$release_metadata"

          assets_json="$RUNNER_TEMP/release-assets.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/$release_id/assets?per_page=100" > "$assets_json"
          python3 - release "$assets_json" "$release_is_draft" <<'PY'
          import json
          import pathlib
          import sys

          local = {path.name for path in pathlib.Path(sys.argv[1]).iterdir() if path.is_file()}
          with open(sys.argv[2], encoding="utf-8") as stream:
              assets = json.load(stream)
          remote = [asset.get("name") for asset in assets]
          if len(remote) != len(set(remote)):
              raise SystemExit("release contains duplicate asset names")
          extras = sorted(set(remote) - local)
          if extras:
              raise SystemExit("release contains unexpected assets: " + ", ".join(extras))
          if sys.argv[3] != "true":
              if set(remote) != local:
                  raise SystemExit("published release is missing approved assets")
              if any(asset.get("state") != "uploaded" for asset in assets):
                  raise SystemExit("published release contains an incomplete asset")
          PY

          for asset in release/*; do
            name="$(basename "$asset")"
            asset_record="$(python3 - "$assets_json" "$name" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              assets = json.load(stream)
          matches = [asset for asset in assets if asset.get("name") == sys.argv[2]]
          if len(matches) > 1:
              raise SystemExit("duplicate release asset: " + sys.argv[2])
          if matches:
              print("{}\t{}".format(matches[0]["id"], matches[0].get("state")))
          PY
            )"
            asset_id="${asset_record%%$'\t'*}"
            asset_state="${asset_record#*$'\t'}"
            if [ -n "$asset_record" ] && [ "$asset_state" = "starter" ]; then
              # GitHub documents a `starter` asset as failed/incomplete and
              # safe to delete. Never replace an uploaded, byte-bearing asset.
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id"
              gh release upload "$tag" "$asset"
            elif [ -n "$asset_record" ] && [ "$asset_state" = "uploaded" ]; then
              downloaded="$RUNNER_TEMP/existing-$name"
              gh api -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id" > "$downloaded"
              if ! cmp --silent "$asset" "$downloaded"; then
                echo "::error::Existing release asset $name differs from the approved candidate."
                exit 1
              fi
              echo "Verified existing release asset $name"
            elif [ -n "$asset_record" ]; then
              echo "::error::Existing release asset $name has unexpected state $asset_state."
              exit 1
            else
              gh release upload "$tag" "$asset"
            fi
          done

          gh api "repos/${GITHUB_REPOSITORY}/releases/$release_id/assets?per_page=100" > "$assets_json"
          python3 - release "$assets_json" <<'PY'
          import json
          import pathlib
          import sys

          local = {path.name for path in pathlib.Path(sys.argv[1]).iterdir() if path.is_file()}
          with open(sys.argv[2], encoding="utf-8") as stream:
              assets = json.load(stream)
          remote = {asset.get("name") for asset in assets}
          if remote != local:
              raise SystemExit("release asset set is not exact after upload")
          if any(asset.get("state") != "uploaded" for asset in assets):
              raise SystemExit("release contains an asset that is not fully uploaded")
          PY
          for asset in release/*; do
            name="$(basename "$asset")"
            asset_id="$(python3 - "$assets_json" "$name" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              matches = [
                  asset
                  for asset in json.load(stream)
                  if asset.get("name") == sys.argv[2]
              ]
          if len(matches) != 1:
              raise SystemExit("release asset is missing or duplicated: " + sys.argv[2])
          print(matches[0]["id"])
          PY
            )"
            downloaded="$RUNNER_TEMP/verified-$name"
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id" > "$downloaded"
            if ! cmp --silent "$asset" "$downloaded"; then
              echo "::error::Uploaded release asset $name differs from the approved bytes."
              exit 1
            fi
          done
          tag_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag changed before release publication."
            exit 1
          fi
          if [ "$release_is_draft" = "true" ]; then
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$release_id" \
              -F draft=false > "$RUNNER_TEMP/published-release.json"
          else
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/releases/$release_id" \
              > "$RUNNER_TEMP/published-release.json"
          fi
          python3 - "$RUNNER_TEMP/published-release.json" "$tag" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              release = json.load(stream)
          if release.get("tag_name") != sys.argv[2] or release.get("draft") is not False:
              raise SystemExit("GitHub release did not reach the published state")
          if release.get("prerelease") is not False:
              raise SystemExit("GitHub release was unexpectedly marked as a prerelease")
          if release.get("immutable") is not True:
              raise SystemExit(
                  "GitHub release is published but not immutable; enable release immutability"
              )
          PY
